name: Instagram · publicar

on:
  schedule:
    # Mañana (9:20 Buenos Aires) y tarde (19:10), cada una con dos turnos de respaldo:
    # GitHub a veces demora o saltea ejecuciones programadas. Si el post ya salió,
    # los turnos de respaldo no hacen nada.
    - cron: '20 12 * * *'
    - cron: '50 12 * * *'
    - cron: '35 13 * * *'
    - cron: '10 22 * * *'
    - cron: '40 22 * * *'
    - cron: '25 23 * * *'
  workflow_dispatch:
    inputs:
      prueba:
        description: 'Modo prueba (muestra el post sin publicarlo)'
        type: boolean
        default: true

concurrency:
  group: instagram-publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Publicar el siguiente post
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          # La historia diaria sale solo con el post de la tarde (turnos después de las 20 UTC).
          if [ "$(date -u +%H)" -ge 20 ]; then export HISTORIA=true; fi
          if [ "${{ github.event.inputs.prueba }}" = "true" ]; then
            python scripts/instagram_publicar.py --prueba
          else
            python scripts/instagram_publicar.py
          fi

      - name: Registrar lo publicado
        if: always()
        run: |
          git config --global user.name "TodoPatagonia Bot"
          git config --global user.email "bot@todopatagonia.com"
          git add instagram/publicados.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "📣 Registro de publicación en Instagram"
          git pull --rebase origin main
          git push
