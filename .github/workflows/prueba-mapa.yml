name: Prueba temporal de teselas IGN
on: workflow_dispatch
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for z in "4/5/9" "5/10/19" "6/21/39"; do
            curl -s -o /tmp/t.png -w "sin referer $z: %{http_code} %{content_type} %{size_download}\n" "https://wms.ign.gob.ar/geoserver/gwc/service/tms/1.0.0/capabaseargenmap@EPSG%3A3857@png/$z.png"
            curl -s -o /tmp/t.png -H "Referer: https://todopatagonia.com/" -w "con referer $z: %{http_code} %{content_type} %{size_download}\n" "https://wms.ign.gob.ar/geoserver/gwc/service/tms/1.0.0/capabaseargenmap@EPSG%3A3857@png/$z.png"
          done
