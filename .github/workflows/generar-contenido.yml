name: Generar contenido con IA

on:
  # Programación automática pausada: usaba la API paga de Anthropic y generaba datos sin verificar.
  # Los artículos ahora se escriben a mano en contenido/blog/ y se arman con scripts/construir_blog.py.
  workflow_dispatch:
    inputs:
      destino:
        description: 'Destino para el artículo (ej: Bariloche, Ushuaia)'
        required: false
        default: ''

concurrency:
  group: publicacion-hostinger
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install anthropic python-slugify

      - name: Generar artículo y actualizar fotos
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          DESTINO_INPUT: ${{ github.event.inputs.destino }}
        run: python scripts/generar_articulo.py

      - name: Commit y push del nuevo contenido
        run: |
          git config --global user.name "TodoPatagonia Bot"
          git config --global user.email "bot@todopatagonia.com"
          git add blog/ en/blog/ pt/blog/ data/ destinos/ en/destinos/ pt/destinos/ index.html en/index.html pt/index.html
          git diff --staged --quiet || git commit -m "✨ Nuevo artículo + destinos actualizados (ES/EN/PT)"
          git push

      - name: Preparar sitio público
        run: python3 scripts/preparar_publicacion.py

      - name: Deploy a Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /public_html/
          local-dir: ./_public/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/**
            README.md
            scripts/**

      - name: Verificar las tres guías públicas
        run: python3 scripts/verificar_guias.py
