name: Deploy a Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Cada lunes 6:07 (Buenos Aires): se republica el sitio y cambia la foto de portada.
    - cron: '7 9 * * 1'

concurrency:
  group: publicacion-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Preparar sitio público
        run: python3 scripts/preparar_publicacion.py

      - name: Deploy vía FTP a Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /public_html/
          local-dir: ./_public/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/**
            README.md
            scripts/**
